<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500;1,700&family=Outfit:wght@300;600;800&display=swap">
<style>
body{margin:0;background:#888}
.a{width:1080px;height:1080px;position:relative;overflow:hidden;display:grid;place-items:center}
.t{text-align:center;line-height:1}
#a1{background:radial-gradient(circle at 30% 25%,#2fb3c4,#0B7A8A 55%,#064e58)}
#a1 .t{font-family:'Playfair Display';font-weight:800;font-size:560px;color:#fff;margin-top:-40px;text-shadow:0 20px 60px rgba(0,0,0,.25)}
#a2{background:#0d0d0f}
#a2 .t{font-family:'Playfair Display';font-weight:600;font-size:400px;color:#d8b46a;letter-spacing:-10px}
#a2 .r{position:absolute;inset:250px;border:4px solid #d8b46a;border-radius:50%;opacity:.55}
#a3{background:linear-gradient(160deg,#ffb88a 0%,#f26b4e 45%,#b8345d 100%)}
#a3 .t{font-family:'Playfair Display';font-style:italic;font-weight:700;font-size:250px;color:#fff;margin-top:-20px;text-shadow:0 14px 40px rgba(80,0,20,.3)}
#a4{background:#f4ede3}
#a4 .t{font-family:'Playfair Display';font-weight:800;font-size:560px;color:#141414;margin-top:-50px}
#a4 .t span{color:#c0392b}
#a5{background:radial-gradient(circle at 70% 20%,#7a1f3d,#3e0d1f 70%)}
#a5 .t{font-family:'Outfit';font-weight:300;font-size:210px;color:#fff;letter-spacing:6px}
#a6{background:linear-gradient(180deg,#f9d9e3,#f3b6c9)}
#a6 .t{font-family:'Playfair Display';font-weight:800;font-size:600px;color:transparent;-webkit-text-stroke:14px #fff;margin-top:-50px}
#a6 .s{position:absolute;bottom:300px;width:100%;text-align:center;font-family:'Outfit';font-weight:600;font-size:70px;letter-spacing:22px;color:#fff;padding-left:22px}
</style></head><body>
<div class="a" id="a1"><div class="t">B</div></div>
<div class="a" id="a2"><div class="r"></div><div class="t">BA</div></div>
<div class="a" id="a3"><div class="t">Bianca</div></div>
<div class="a" id="a4"><div class="t">B<span>.</span></div></div>
<div class="a" id="a5"><div class="t">bianca</div></div>
<div class="a" id="a6"><div class="t">B</div><div class="s">BIANCA</div></div>
</body></html>
