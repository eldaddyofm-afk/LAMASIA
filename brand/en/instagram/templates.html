<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root { --mar:#0B7A8A; --maro:#075B67; --arena:#F6EFE4; --arenao:#EADFCB; --sol:#F6C66B; --coral:#F26B4E; --tinta:#1D2A30; --bruma:#5F6E76; }
* { box-sizing:border-box } body { margin:0; font-family:"Nunito Sans",sans-serif; color:var(--tinta); }
.post { width:1080px; height:1080px; position:relative; overflow:hidden; padding:96px; display:flex; flex-direction:column; background:var(--arena); }
.story { width:1080px; height:1920px; position:relative; overflow:hidden; padding:120px 96px; display:flex; flex-direction:column; background:var(--arena); }
.mar { background:var(--mar); color:#fff; } .blanco { background:#fff; }
h1 { font-family:Outfit; font-weight:800; font-size:92px; line-height:1.02; letter-spacing:-.025em; margin:0; text-wrap:balance; }
h2 { font-family:Outfit; font-weight:700; font-size:64px; line-height:1.08; letter-spacing:-.02em; margin:0; text-wrap:balance; }
.eyebrow { font-family:Outfit; font-weight:600; font-size:26px; letter-spacing:.18em; text-transform:uppercase; color:var(--mar); margin-bottom:28px; }
.mar .eyebrow { color:var(--sol); }
p { font-size:34px; line-height:1.4; margin:0; max-width:820px; }
.mar p { color:rgba(255,255,255,.92) }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; font-family:Outfit; font-weight:600; font-size:26px; letter-spacing:.12em; text-transform:uppercase; color:var(--bruma); }
.mar .foot { color:rgba(255,255,255,.8) }
.logo { display:flex; align-items:center; gap:22px; } .logo svg { width:84px; height:84px; } .logo span { font-family:Outfit; font-weight:700; font-size:34px; letter-spacing:.14em; }
.big { font-family:Outfit; font-weight:800; font-size:300px; line-height:.9; letter-spacing:-.05em; color:var(--mar); }
.mar .big { color:#fff }
.chips { display:flex; flex-wrap:wrap; gap:18px; margin-top:40px; }
.chip { font-family:Outfit; font-weight:600; font-size:36px; padding:22px 36px; border-radius:999px; background:#fff; border:3px solid var(--arenao); }
.chip.c1{border-color:#6FB7C4}.chip.c2{border-color:#9A8CC9}.chip.c3{border-color:#D9D4C7}.chip.c4{border-color:#F2B33D}.chip.c5{border-color:#E8A6B8}.chip.c6{border-color:#B8C4C9}
.steps { display:grid; gap:34px; margin-top:48px; }
.step { display:grid; grid-template-columns:92px 1fr; gap:28px; align-items:start; }
.step b { width:92px; height:92px; border-radius:28px; background:var(--mar); color:#fff; display:grid; place-items:center; font-family:Outfit; font-size:44px; font-weight:800; }
.step div { font-size:36px; line-height:1.3; } .step small { display:block; color:var(--bruma); font-size:28px; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:52px; }
.card { background:#fff; border-radius:36px; padding:40px 32px; border:3px solid var(--arenao); }
.card.hi { border-color:var(--mar); }
.card .kg { font-family:Outfit; font-weight:600; font-size:28px; color:var(--bruma); }
.card .eur { font-family:Outfit; font-weight:800; font-size:56px; white-space:nowrap; letter-spacing:-.03em; line-height:1.1; margin:10px 0; }
.card .d { font-size:24px; color:var(--bruma); line-height:1.35; }
.zonas { margin-top:48px; display:grid; gap:20px; font-size:34px; }
.zonas div { display:flex; justify-content:space-between; gap:20px; border-bottom:3px solid var(--arenao); padding-bottom:16px; }
.zonas b { font-family:Outfit; font-weight:600; color:var(--mar); text-align:right; }
.btn { display:inline-block; background:var(--coral); color:#fff; font-family:Outfit; font-weight:700; font-size:40px; padding:30px 56px; border-radius:999px; margin-top:48px; }
.qr { background:#fff; border-radius:36px; padding:36px; width:520px; height:520px; margin:60px auto 0; }
.qr img { width:100%; height:100%; }
.wave { position:absolute; left:-40px; right:-40px; bottom:-30px; height:260px; opacity:.16; }
.hanger { position:absolute; right:-80px; bottom:-60px; width:620px; opacity:.1; }
</style></head><body>
<script>
const M = (c) => `<svg viewBox="0 0 200 200"><g fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M100 80 V68 A13 13 0 1 1 113 60"/><path d="M100 80 L26 134 C45 134 45 118 63 118 S82 134 100 134 S118 150 137 150 S156 134 174 134 Z"/></g></svg>`;
const WAVE = (c) => `<svg class="wave" viewBox="0 0 1200 260" preserveAspectRatio="none"><path d="M0 130 C150 40 300 40 450 130 S750 220 900 130 S1150 40 1200 130 V260 H0z" fill="${c}"/></svg>`;
const logo = (c, t) => `<div class="logo">${M(c)}<span style="color:${t}">COSTA CLEAN</span></div>`;
const foot = (dark) => `<div class="foot"><span>costaclean.es</span><span>Málaga</span></div>`;
const posts = [
 `<div class="post mar" id="p1">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:150px"><div class="eyebrow">Now in Málaga</div><h1>Your laundry, back pressed, vacuum-packed and scented your way.</h1><p style="margin-top:36px">We pick it up by bike and bring it back in 24-48 h. You just leave the bag at the door.</p></div>${foot()}</div>`,
 `<div class="post" id="p2">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:70px"><div class="eyebrow">How it works</div><h2>Four steps. Zero effort.</h2><div class="steps"><div class="step"><b>1</b><div>Order on WhatsApp<small>Bag size, scent and a two-hour slot.</small></div></div><div class="step"><b>2</b><div>Our rider comes by bike<small>Weighs the bag in front of you.</small></div></div><div class="step"><b>3</b><div>We wash, dry and press<small>With your scent in the final rinse.</small></div></div><div class="step"><b>4</b><div>Back to you, vacuum-packed<small>Ready for the wardrobe.</small></div></div></div></div>${foot()}</div>`,
 `<div class="post blanco" id="p3">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">Vacuum-packed</div><div class="big">60 %</div><h2 style="margin-top:20px">less space in your wardrobe.</h2><p style="margin-top:28px;color:var(--bruma)">No damp, no odours, no dust. Perfect for seasonal clothes and duvets.</p></div>${foot()}</div>`,
 `<div class="post" id="p4">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:70px"><div class="eyebrow">Pick your scent</div><h2>What should your clothes smell like this week?</h2><div class="chips"><span class="chip c1">Sea breeze</span><span class="chip c2">Lavender</span><span class="chip c3">Clean cotton</span><span class="chip c4">Mediterranean citrus</span><span class="chip c5">Málaga jasmine</span><span class="chip c6">Fragrance-free</span></div><p style="margin-top:44px;color:var(--bruma);font-size:30px">Professional fabric fragrance in the final rinse. The fragrance-free option is hypoallergenic.</p></div>${foot()}</div>`,
 `<div class="post" id="p5">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">Prices</div><h2>Per bag. Pickup and delivery included.</h2><div class="cards"><div class="card"><div class="kg">S · up to 5 kg</div><div class="eur">€22.90</div><div class="d">One person, one week</div></div><div class="card hi"><div class="kg">M · up to 10 kg</div><div class="eur">€36.90</div><div class="d">A couple. Most popular</div></div><div class="card"><div class="kg">L · up to 15 kg</div><div class="eur">€49.90</div><div class="d">Family or bed linen</div></div></div><p style="margin-top:40px;color:var(--bruma);font-size:28px">All with basic pressing, scent and vacuum packing. VAT included.</p></div>${foot()}</div>`,
 `<div class="post blanco" id="p6">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">Where</div><h2>Your neighbourhood, your day.</h2><div class="zonas"><div><span>Centro, Soho, Malagueta</span><b>every day</b></div><div><span>Huelin, Ctra. de Cádiz, Cruz de Humilladero</span><b>Mon &amp; Thu</b></div><div><span>Pedregalejo and El Palo</span><b>Tue &amp; Fri</b></div><div><span>Ciudad Jardín and Teatinos</span><b>Wed &amp; Sat</b></div></div></div>${foot()}</div>`,
 `<div class="post mar" id="p7">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:150px"><div class="eyebrow">Pressing</div><h1>Shirts steam-pressed. Trousers with a crease.</h1><p style="margin-top:36px">Basic pressing is included in every bag. Want everything ironed? Add it as an extra.</p></div>${foot()}</div>`,
 `<div class="post" id="p8">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">By bike</div><div class="big" style="font-size:220px">0</div><h2 style="margin-top:10px">vans on your street.</h2><p style="margin-top:28px;color:var(--bruma)">We deliver by electric cargo bike. Faster in the Centro, no fumes, no double parking.</p></div>${foot()}</div>`,
 `<div class="post mar" id="p9">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:120px"><div class="eyebrow">Holiday rentals</div><h2 style="color:#fff">Manage holiday apartments? Sheets and towels ready for check-in.</h2><p style="margin-top:36px">Bed and bath kit from €14.90 + VAT. Pickup at check-out, delivery before the next guest. Message us for rates.</p></div>${foot()}</div>`,
];
const stories = [
 `<div class="story mar" id="s1">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:160px"><div class="eyebrow">Book a pickup</div><h1 style="font-size:104px">Scan and order. We come by bike.</h1><div class="qr"><img src="../qr-landing.svg"></div><p style="margin-top:50px;text-align:center;font-family:Outfit;font-weight:600">or message us: WhatsApp +34 600 000 000</p></div>${foot()}</div>`,
 `<div class="story" id="s2">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:200px"><div class="eyebrow">Poll</div><h1 style="font-size:104px">Which scent is yours?</h1><div class="chips" style="flex-direction:column;align-items:flex-start;gap:26px;margin-top:70px"><span class="chip c1">Sea breeze</span><span class="chip c2">Lavender</span><span class="chip c3">Clean cotton</span><span class="chip c4">Mediterranean citrus</span><span class="chip c5">Málaga jasmine</span><span class="chip c6">Fragrance-free</span></div><p style="margin-top:60px;color:var(--bruma)">Add the Instagram poll sticker here.</p></div>${foot()}</div>`,
 `<div class="story blanco" id="s3">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:220px"><div class="eyebrow">From</div><div class="big" style="font-size:230px">€22.90</div><h2 style="margin-top:40px">Washed, pressed, vacuum-packed and scented your way. At your door.</h2><span class="btn">Book a pickup</span><p style="margin-top:60px;color:var(--bruma)">Link in bio.</p></div>${foot()}</div>`,
];
document.body.innerHTML = posts.join('') + stories.join('');
</script></body></html>
