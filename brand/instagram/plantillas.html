<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root { --mar:#0B7A8A; --maro:#075B67; --arena:#F6EFE4; --arenao:#EADFCB; --sol:#F6C66B; --coral:#F26B4E; --tinta:#1D2A30; --bruma:#5F6E76; }
* { box-sizing:border-box } body { margin:0; font-family:"Nunito Sans",sans-serif; color:var(--tinta); }
.post { width:1080px; height:1080px; position:relative; overflow:hidden; padding:96px; display:flex; flex-direction:column; background:var(--arena); }
.story { width:1080px; height:1920px; position:relative; overflow:hidden; padding:120px 96px; display:flex; flex-direction:column; background:var(--arena); }
.mar { background:var(--mar); color:#fff; } .blanco { background:#fff; }
h1 { font-family:Outfit; font-weight:800; font-size:92px; line-height:1.02; letter-spacing:-.025em; margin:0; text-wrap:balance; }
h2 { font-family:Outfit; font-weight:700; font-size:64px; line-height:1.08; letter-spacing:-.02em; margin:0; text-wrap:balance; }
.eyebrow { font-family:Outfit; font-weight:600; font-size:26px; letter-spacing:.18em; text-transform:uppercase; color:var(--mar); margin-bottom:28px; }
.mar .eyebrow { color:var(--sol); }
p { font-size:34px; line-height:1.4; margin:0; max-width:820px; }
.mar p { color:rgba(255,255,255,.92) }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; font-family:Outfit; font-weight:600; font-size:26px; letter-spacing:.12em; text-transform:uppercase; color:var(--bruma); }
.mar .foot { color:rgba(255,255,255,.8) }
.logo { display:flex; align-items:center; gap:22px; } .logo svg { width:84px; height:84px; } .logo span { font-family:Outfit; font-weight:700; font-size:34px; letter-spacing:.14em; }
.big { font-family:Outfit; font-weight:800; font-size:300px; line-height:.9; letter-spacing:-.05em; color:var(--mar); }
.mar .big { color:#fff }
.chips { display:flex; flex-wrap:wrap; gap:18px; margin-top:40px; }
.chip { font-family:Outfit; font-weight:600; font-size:36px; padding:22px 36px; border-radius:999px; background:#fff; border:3px solid var(--arenao); }
.chip.c1{border-color:#6FB7C4}.chip.c2{border-color:#9A8CC9}.chip.c3{border-color:#D9D4C7}.chip.c4{border-color:#F2B33D}.chip.c5{border-color:#E8A6B8}.chip.c6{border-color:#B8C4C9}
.steps { display:grid; gap:34px; margin-top:48px; }
.step { display:grid; grid-template-columns:92px 1fr; gap:28px; align-items:start; }
.step b { width:92px; height:92px; border-radius:28px; background:var(--mar); color:#fff; display:grid; place-items:center; font-family:Outfit; font-size:44px; font-weight:800; }
.step div { font-size:36px; line-height:1.3; } .step small { display:block; color:var(--bruma); font-size:28px; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:52px; }
.card { background:#fff; border-radius:36px; padding:40px 32px; border:3px solid var(--arenao); }
.card.hi { border-color:var(--mar); }
.card .kg { font-family:Outfit; font-weight:600; font-size:28px; color:var(--bruma); }
.card .eur { font-family:Outfit; font-weight:800; font-size:56px; white-space:nowrap; letter-spacing:-.03em; line-height:1.1; margin:10px 0; }
.card .d { font-size:24px; color:var(--bruma); line-height:1.35; }
.zonas { margin-top:48px; display:grid; gap:20px; font-size:34px; }
.zonas div { display:flex; justify-content:space-between; gap:20px; border-bottom:3px solid var(--arenao); padding-bottom:16px; }
.zonas b { font-family:Outfit; font-weight:600; color:var(--mar); text-align:right; }
.btn { display:inline-block; background:var(--coral); color:#fff; font-family:Outfit; font-weight:700; font-size:40px; padding:30px 56px; border-radius:999px; margin-top:48px; }
.qr { background:#fff; border-radius:36px; padding:36px; width:520px; height:520px; margin:60px auto 0; }
.qr img { width:100%; height:100%; }
.wave { position:absolute; left:-40px; right:-40px; bottom:-30px; height:260px; opacity:.16; }
.hanger { position:absolute; right:-80px; bottom:-60px; width:620px; opacity:.1; }
</style></head><body>
<script>
const M = (c) => `<svg viewBox="0 0 200 200"><g fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M100 80 V68 A13 13 0 1 1 113 60"/><path d="M100 80 L26 134 C45 134 45 118 63 118 S82 134 100 134 S118 150 137 150 S156 134 174 134 Z"/></g></svg>`;
const WAVE = (c) => `<svg class="wave" viewBox="0 0 1200 260" preserveAspectRatio="none"><path d="M0 130 C150 40 300 40 450 130 S750 220 900 130 S1150 40 1200 130 V260 H0z" fill="${c}"/></svg>`;
const logo = (c, t) => `<div class="logo">${M(c)}<span style="color:${t}">COSTA CLEAN</span></div>`;
const foot = (dark) => `<div class="foot"><span>costaclean.es</span><span>Málaga</span></div>`;
const posts = [
 `<div class="post mar" id="p1">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:150px"><div class="eyebrow">Llegamos a Málaga</div><h1>Tu ropa vuelve planchada, al vacío y con tu aroma.</h1><p style="margin-top:36px">La recogemos en bici y te la devolvemos en 24-48 h. Tú solo dejas la bolsa en la puerta.</p></div>${foot()}</div>`,
 `<div class="post" id="p2">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:70px"><div class="eyebrow">Así funciona</div><h2>Cuatro pasos. Cero esfuerzo.</h2><div class="steps"><div class="step"><b>1</b><div>Pides por WhatsApp<small>Bolsa, aroma y franja de dos horas.</small></div></div><div class="step"><b>2</b><div>Pasa el rider en bici<small>Pesa la bolsa delante de ti.</small></div></div><div class="step"><b>3</b><div>Lavamos, secamos y planchamos<small>Con tu aroma en el último aclarado.</small></div></div><div class="step"><b>4</b><div>Te la devolvemos al vacío<small>Lista para el armario.</small></div></div></div></div>${foot()}</div>`,
 `<div class="post blanco" id="p3">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">Envasado al vacío</div><div class="big">60 %</div><h2 style="margin-top:20px">menos espacio en el armario.</h2><p style="margin-top:28px;color:var(--bruma)">Sin humedad, sin olores, sin polvo. Perfecto para la ropa de temporada y los nórdicos.</p></div>${foot()}</div>`,
 `<div class="post" id="p4">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:70px"><div class="eyebrow">Elige tu aroma</div><h2>¿A qué quieres que huela tu ropa esta semana?</h2><div class="chips"><span class="chip c1">Brisa marina</span><span class="chip c2">Lavanda</span><span class="chip c3">Algodón limpio</span><span class="chip c4">Cítrico mediterráneo</span><span class="chip c5">Jazmín de Málaga</span><span class="chip c6">Sin perfume</span></div><p style="margin-top:44px;color:var(--bruma);font-size:30px">Perfumante textil profesional en el último aclarado. La opción sin perfume es hipoalergénica.</p></div>${foot()}</div>`,
 `<div class="post" id="p5">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">Precios</div><h2>Por bolsa. Recogida y entrega incluidas.</h2><div class="cards"><div class="card"><div class="kg">S · hasta 5 kg</div><div class="eur">22,90 €</div><div class="d">Una persona, una semana</div></div><div class="card hi"><div class="kg">M · hasta 10 kg</div><div class="eur">36,90 €</div><div class="d">Pareja. La más pedida</div></div><div class="card"><div class="kg">L · hasta 15 kg</div><div class="eur">49,90 €</div><div class="d">Familia o ropa de cama</div></div></div><p style="margin-top:40px;color:var(--bruma);font-size:28px">Todas con plancha básica, aroma y envasado al vacío. IVA incluido.</p></div>${foot()}</div>`,
 `<div class="post blanco" id="p6">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">Dónde</div><h2>Tu barrio, tu día.</h2><div class="zonas"><div><span>Centro, Soho, Malagueta</span><b>todos los días</b></div><div><span>Huelin, Ctra. de Cádiz, Cruz de Humilladero</span><b>lunes y jueves</b></div><div><span>Pedregalejo y El Palo</span><b>martes y viernes</b></div><div><span>Ciudad Jardín y Teatinos</span><b>miércoles y sábado</b></div></div></div>${foot()}</div>`,
 `<div class="post mar" id="p7">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:150px"><div class="eyebrow">Plancha</div><h1>Las camisas, a vapor. Los pantalones, con raya.</h1><p style="margin-top:36px">La plancha básica va incluida en todas las bolsas. Si quieres todo planchado, lo pides como extra.</p></div>${foot()}</div>`,
 `<div class="post" id="p8">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:60px"><div class="eyebrow">En bici</div><div class="big" style="font-size:220px">0</div><h2 style="margin-top:10px">furgonetas en tu calle.</h2><p style="margin-top:28px;color:var(--bruma)">Repartimos en bicicleta de carga eléctrica. Más rápido en el Centro, sin humos y sin dobles filas.</p></div>${foot()}</div>`,
 `<div class="post mar" id="p9">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:120px"><div class="eyebrow">Apartamentos turísticos</div><h2 style="color:#fff">¿Gestionas pisos turísticos? Sábanas y toallas listas para el check-in.</h2><p style="margin-top:36px">Kit cama y baño desde 14,90 € + IVA. Recogida al check-out y entrega antes del siguiente huésped. Escríbenos y te pasamos tarifa.</p></div>${foot()}</div>`,
];
const stories = [
 `<div class="story mar" id="s1">${WAVE('#fff')}${logo('#fff','#fff')}<div style="margin-top:160px"><div class="eyebrow">Pide tu recogida</div><h1 style="font-size:104px">Escanea y pide. Pasamos en bici.</h1><div class="qr"><img src="../qr-landing.svg"></div><p style="margin-top:50px;text-align:center;font-family:Outfit;font-weight:600">o escríbenos: WhatsApp 600 000 000</p></div>${foot()}</div>`,
 `<div class="story" id="s2">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:200px"><div class="eyebrow">Encuesta</div><h1 style="font-size:104px">¿Cuál es tu aroma?</h1><div class="chips" style="flex-direction:column;align-items:flex-start;gap:26px;margin-top:70px"><span class="chip c1">Brisa marina</span><span class="chip c2">Lavanda</span><span class="chip c3">Algodón limpio</span><span class="chip c4">Cítrico mediterráneo</span><span class="chip c5">Jazmín de Málaga</span><span class="chip c6">Sin perfume</span></div><p style="margin-top:60px;color:var(--bruma)">Añade aquí el sticker de encuesta de Instagram.</p></div>${foot()}</div>`,
 `<div class="story blanco" id="s3">${logo('#0B7A8A','#1D2A30')}<div style="margin-top:220px"><div class="eyebrow">Desde</div><div class="big" style="font-size:260px">22,90 €</div><h2 style="margin-top:40px">Lavada, planchada, al vacío y con tu aroma. En tu puerta.</h2><span class="btn">Pedir recogida</span><p style="margin-top:60px;color:var(--bruma)">Enlace en la bio.</p></div>${foot()}</div>`,
];
document.body.innerHTML = posts.join('') + stories.join('');
</script></body></html>
